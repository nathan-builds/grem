<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      body.over-gremlin {
        cursor: grab;
      }
      body.dragging {
        cursor: grabbing;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #bubble {
        position: absolute;
        display: none;
        transform: translate(-50%, -100%);
        background: #fffef5;
        color: #222;
        border: 2px solid #222;
        border-radius: 10px;
        padding: 5px 10px;
        font:
          600 13px/1.2 -apple-system,
          sans-serif;
        white-space: nowrap;
        box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.25);
        pointer-events: none;
      }
      #bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -7px;
        margin-left: -5px;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
        border-top: 7px solid #222;
      }
      #chat {
        position: absolute;
        display: none;
        flex-direction: column;
        transform: translate(-50%, -100%);
        width: 260px;
        background: #fffef5;
        color: #222;
        border: 2px solid #222;
        border-radius: 10px;
        box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.25);
        font:
          500 13px/1.35 -apple-system,
          sans-serif;
        overflow: visible;
      }
      #chat::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -9px;
        margin-left: -5px;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
        border-top: 7px solid #222;
      }
      #chat-close {
        position: absolute;
        top: -10px;
        right: -10px;
        width: 20px;
        height: 20px;
        border: 2px solid #222;
        border-radius: 50%;
        background: #fffef5;
        color: #222;
        font: 700 11px/1 -apple-system, sans-serif;
        cursor: pointer;
        padding: 0;
      }
      #chat-log {
        max-height: 240px;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        border-radius: 8px 8px 0 0;
      }
      .msg {
        max-width: 85%;
        padding: 4px 8px;
        border-radius: 8px;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: #d9ecff;
        border: 1px solid #9dc4ea;
      }
      .msg.gremlin {
        align-self: flex-start;
        background: #efe9d0;
        border: 1px solid #cfc7a4;
      }
      .msg.typing {
        color: #888;
        font-style: italic;
      }
      #timer {
        position: absolute;
        display: none;
        flex-direction: column;
        transform: translate(-50%, -100%);
        width: 180px;
        background: #fffef5;
        color: #222;
        border: 2px solid #222;
        border-radius: 10px;
        box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.25);
        font:
          500 13px/1.35 -apple-system,
          sans-serif;
      }
      #timer::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -9px;
        margin-left: -5px;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
        border-top: 7px solid #222;
      }
      #timer-title {
        padding: 6px 9px 0;
        font-weight: 700;
      }
      #timer-form {
        display: flex;
        margin: 0;
      }
      #timer-input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        padding: 5px 9px 7px;
        font: inherit;
        color: inherit;
        background: transparent;
      }
      #timer-hint {
        display: none;
        padding: 0 9px 6px;
        color: #b04a3a;
        font-size: 11px;
      }
      #chat-form {
        display: flex;
        border-top: 2px solid #222;
        margin: 0;
      }
      #chat-input {
        flex: 1;
        border: 0;
        outline: none;
        padding: 7px 9px;
        font: inherit;
        color: inherit;
        background: transparent;
        border-radius: 0 0 8px 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubble"></div>
    <div id="timer">
      <div id="timer-title">set a timer</div>
      <form id="timer-form">
        <input
          id="timer-input"
          type="text"
          placeholder="5m, 90s, 1h30m..."
          autocomplete="off"
          maxlength="20"
        />
      </form>
      <div id="timer-hint">try 5m, 90s, or 1h30m</div>
    </div>
    <div id="chat">
      <button id="chat-close" type="button" title="Close">x</button>
      <div id="chat-log"></div>
      <form id="chat-form">
        <input
          id="chat-input"
          type="text"
          placeholder="say something..."
          autocomplete="off"
          maxlength="500"
        />
      </form>
    </div>
    <script src="gremlin.js"></script>
  </body>
</html>
